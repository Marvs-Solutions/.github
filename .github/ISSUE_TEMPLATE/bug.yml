name: Bug
description: Algo que deveria funcionar e não funciona
labels: ["bug"]
body:
  - type: textarea
    id: problema
    attributes:
      label: O que acontece
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: O que deveria acontecer
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Como reproduzir
      placeholder: |
        1.
        2.
    validations:
      required: true
  - type: input
    id: ambiente
    attributes:
      label: Ambiente
      description: Navegador, aparelho, versão do app, produção ou local.
  - type: dropdown
    id: urgencia
    attributes:
      label: Urgência
      options:
        - Cliente parado
        - Atrapalha, mas tem contorno
        - Pode esperar
    validations:
      required: true
